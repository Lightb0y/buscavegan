name: Web

# Vercel también corre el build al deployar, pero para entonces ya está
# publicado. Esto lo corre antes, sobre el pull request.
on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tests de búsqueda y resaltado
        run: npm test

      # El build hace de chequeo de tipos y de que las ~7.400 fichas se
      # generen: si un slug o una categoría quedaron rotos, falla acá.
      - name: Build estático
        run: npm run build
