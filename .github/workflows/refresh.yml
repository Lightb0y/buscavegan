name: Refrescar base

# El catálogo de Open Food Facts se mueve a diario, así que la base se rearma
# sola. Dos cadencias, por el costo de cada una:
#   - semanal: refresco por API, más un pedazo de la cola de fichas de
#     supermercado (unos minutos)
#   - mensual: refresco completo, que además baja el dump de OFF (1,3 GB) y
#     recorre de nuevo el árbol de categorías de las cinco cadenas
#
# Las fichas de los supermercados son la evidencia más fuerte que tiene el
# proyecto y antes se cosechaban a mano, una sola vez. Ahora entran acá: cada
# corrida se lleva un pedazo acotado de la cola (`FICHAS_POR_CORRIDA`) y deja
# el resto para la siguiente.
on:
  schedule:
    - cron: "0 6 * * 1"    # lunes 06:00 UTC — refresco por API
    - cron: "0 4 1 * *"    # día 1 de cada mes — refresco completo
  workflow_dispatch:
    inputs:
      completo:
        description: "Bajar el dump entero de OFF"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

# Para poder commitear los datos exportados de la web. El deploy en Vercel se
# dispara solo con ese commit: nadie tiene que acordarse de republicar.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # La corrida mensual hace tres cosas caras seguidas: el dump de OFF, el
    # árbol entero de las cinco cadenas y la cola de fichas. 90 minutos le
    # quedaban justos.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El cache de OFF es lo que evita repreguntar por productos ya conocidos
      # en cada corrida. Sin esto, cada refresco arrancaría de cero.
      - name: Restaurar la base de la corrida anterior
        uses: actions/cache@v4
        with:
          path: data/buscavegan.db
          key: buscavegan-db-${{ github.run_id }}
          restore-keys: buscavegan-db-

      - name: Correr el pipeline
        env:
          OFF_USER_AGENT: "buscavegan/0.1 (https://github.com/Lightb0y/buscavegan)"
        run: |
          if [ "${{ inputs.completo }}" = "true" ] || \
             [ "${{ github.event.schedule }}" = "0 4 1 * *" ]; then
            python refresh.py --completo
          else
            python refresh.py
          fi

      - name: Correr los tests contra la base nueva
        run: python -m pytest tests -q

      # Recién acá, con los tests en verde: exportar lo que consume el sitio y
      # commitearlo. Vercel ve el commit y redeploya. Si los tests fallan, el
      # sitio se queda con los datos buenos de la semana pasada.
      - name: Exportar los datos de la web
        run: python export_web.py

      - name: Publicar los datos nuevos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "El catálogo no cambió: no hay nada que publicar."
          else
            git commit -m "Refresca el catálogo publicado ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Guardar el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            data/sprint0_report.json
            data/modelo_reporte.json
          if-no-files-found: warn
